<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bot-api.transport.nov.ru
    DocumentRoot /var/www/bot-api

    ErrorLog ${APACHE_LOG_DIR}/bot-api-error.log
    CustomLog ${APACHE_LOG_DIR}/bot-api-access.log combined

    # Раздача статических медиафайлов (изображения, памятки, PDF)
    <Directory /var/www/bot-api>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # SSL сертификаты Let's Encrypt
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bot-api.transport.nov.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bot-api.transport.nov.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Проксирование вебхуков платформы MAX в Python-сервис (127.0.0.1:8081)
    ProxyPass /webhook http://127.0.0.1:8081/webhook
    ProxyPassReverse /webhook http://127.0.0.1:8081/webhook
</VirtualHost>
</IfModule>
